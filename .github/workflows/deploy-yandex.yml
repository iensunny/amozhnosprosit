name: Deploy to Yandex Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FOLDER_ID: b1g3o0e47s7t1v4mkhpl
  REGISTRY_ID: crpa3g2jf64p270ui74v
  IMAGE_NAME: amozhnosprosit
  SERVICE_ACCOUNT_ID: ajeot9ha2ce8au4g9bjp
  YDB_CONNECTION_STRING: grpcs://ydb.serverless.yandexcloud.net:2135/ru-central1/b1gpb22f92qrgsvmhcop/etn36294b1hil767oh02
  LOCKBOX_SECRET_ID: e6qnochg3ehh8aj67od7

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify GitHub OIDC identity
        run: |
          token="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL")"
          TOKEN="$token" node -e 'const [, payload] = process.env.TOKEN.split("."); const claims = JSON.parse(Buffer.from(payload, "base64url")); console.log(JSON.stringify({ iss: claims.iss, aud: claims.aud, sub: claims.sub }));'

      - name: Authorize Docker in Yandex Container Registry
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-id: ${{ env.SERVICE_ACCOUNT_ID }}

      - name: Build and upload image
        run: |
          docker build --tag cr.yandex/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker push cr.yandex/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy private revision
        uses: yc-actions/yc-sls-container-deploy@v5
        with:
          yc-sa-id: ${{ env.SERVICE_ACCOUNT_ID }}
          container-name: amozhnosprosit
          folder-id: ${{ env.FOLDER_ID }}
          public: "false"
          revision-service-account-id: ${{ env.SERVICE_ACCOUNT_ID }}
          revision-image-url: cr.yandex/${{ env.REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          revision-memory: 256Mb
          revision-cores: "1"
          revision-core-fraction: "100"
          revision-concurrency: "1"
          revision-execution-timeout: "10"
          revision-env: |
            YDB_CONNECTION_STRING=${{ env.YDB_CONNECTION_STRING }}
            MAX_BOT_NAME=se14681938_bot
          revision-secrets: |
            MAX_BOT_TOKEN=${{ env.LOCKBOX_SECRET_ID }}/latest/MAX_BOT_TOKEN
